# Playwright E2E 테스트 전용 프로필 (--spring.profiles.active=e2e).
# 이 파일은 커밋되므로 실제 비밀값을 넣지 않는다 — Gemini는 StubAiChatService가
# 가로채므로 애초에 API 키가 필요 없고, 나머지는 로컬/CI 환경변수로 덮어쓸 수
# 있게 기본값(:default 문법)만 둔다.
#
# 로컬에서 돌릴 땐 이 값들에 맞는 전용 Postgres가 필요하다 — 기존 dev-up의
# trip-db(5434)와 섞이지 않게 별도로 띄운다:
#   docker run -d --name trip-e2e-db -p 5432:5432 \
#     -e POSTGRES_DB=test -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test \
#     pgvector/pgvector:pg16
# (CI에서는 client job의 postgres 서비스 컨테이너가 같은 5432/test/test/test로
# 뜬다 — 로컬/CI가 같은 값을 쓰도록 맞춤.)

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/test}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:test}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:test}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# 실제 장소 검색(위시리스트 추가)에 쓰이므로 진짜 값이 필요하다 — CI에서는
# secrets로 주입(KAKAO_API_KEY), 로컬에서는 기존 gitignore된 값을 그대로 쓰거나
# 환경변수로 덮어쓴다.
kakao.api.key=${KAKAO_API_KEY:}

# Gemini/Groq/TourAPI는 이 프로필에서 전혀 호출되지 않는다(Gemini는
# StubAiChatService가 대신함, Groq/TourAPI는 이 E2E 시나리오 범위 밖) —
# @Value 바인딩 실패로 컨텍스트 기동 자체가 막히지 않게 더미 값만 채운다.
gemini.api.key=unused-in-e2e-profile
spring.ai.google.genai.api-key=${gemini.api.key}
spring.ai.google.genai.chat.model=gemini-2.5-flash
groq.api.key=unused-in-e2e-profile
tourapi.service.key=unused-in-e2e-profile
visitjeju.api.key=unused-in-e2e-profile
