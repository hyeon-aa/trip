# Render 배포용 프로필. `SPRING_PROFILES_ACTIVE=prod`로 활성화한다.
# application.properties(로컬 전용, gitignore 대상)는 Render가 clone하는 레포에
# 아예 존재하지 않으므로, 이 프로필이 필요한 설정을 전부 자체적으로 갖고 있어야
# 한다. 시크릿은 전부 ${ENV_VAR} 형태(실제 값 없음)로만 두고, 진짜 값은 Render
# 대시보드의 환경변수로 채운다 — application-e2e.properties와 동일한 패턴이라
# 안전하게 커밋된다.

# Render가 컨테이너에 주입하는 PORT를 반드시 여기서 받아야 한다 — 안 그러면
# 기본 8080으로만 뜨고 Render 헬스체크가 실패한다.
server.port=${PORT:8080}

# Render Postgres의 "Internal Database URL"(postgres://user:pass@host/db)을
# 그대로 쓰지 말고, host/port/db 이름만 뽑아서 jdbc:postgresql://host:port/db
# 형태로 SPRING_DATASOURCE_URL에 넣는다. user/password는 별도 변수로 분리.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Render Key Value(Redis)는 TLS 필수 — rediss://host:port 형태로 주므로
# host/port만 뽑아서 아래에 넣고 ssl은 true로 켠다.
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL_ENABLED:true}

kakao.api.key=${KAKAO_API_KEY}

visitjeju.api.key=${VISITJEJU_API_KEY}

gemini.api.key=${GEMINI_API_KEY}
spring.ai.google.genai.api-key=${gemini.api.key}
spring.ai.google.genai.chat.model=gemini-2.5-flash

groq.api.key=${GROQ_API_KEY}

tourapi.service.key=${TOURAPI_SERVICE_KEY}

resilience4j.circuitbreaker.instances.gemini.sliding-window-size=10
resilience4j.circuitbreaker.instances.gemini.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.gemini.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.gemini.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.gemini.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.gemini.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.kakao.sliding-window-size=10
resilience4j.circuitbreaker.instances.kakao.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.kakao.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.kakao.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.kakao.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.kakao.automatic-transition-from-open-to-half-open-enabled=true
