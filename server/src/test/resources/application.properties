# 테스트 전용 설정 — 실제 시크릿 없음. src/test/resources는 테스트 클래스패스에서
# src/main/resources보다 우선하므로, 로컬 개발자의 gitignore된 application.properties
# 없이도 `./gradlew test`가 돈다.
#
# spring.datasource.*는 더 이상 여기 없다 — @SpringBootTest를 쓰는 테스트는 전부
# IntegrationTestSupport(Testcontainers + @ServiceConnection)를 상속해서 매번 진짜
# Postgres 컨테이너로 자동 연결되기 때문이다(이슈 #49). 순수 Mockito 유닛 테스트는
# 스프링 컨텍스트 자체를 안 띄우니 이 파일을 아예 안 읽는다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

kakao.api.key=test-key
gemini.api.key=test-key
spring.ai.google.genai.api-key=${gemini.api.key}
spring.ai.google.genai.chat.model=gemini-2.5-flash
groq.api.key=test-key
tourapi.service.key=test-key
