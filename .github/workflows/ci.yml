name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # client/server 두 job은 main 브랜치 보호 규칙에 필수 상태 체크로 걸려있어서,
  # 워크플로 트리거 자체를 paths-ignore로 건너뛰면 그 PR에서 체크가 아예
  # 생성되지 않아 영원히 pending으로 남는다(머지가 막힘) — 그래서 트리거는
  # 항상 그대로 두고, 대신 이 changes job으로 "실제 코드(client/server)가
  # 바뀌었는지"만 먼저 판정해서 각 job의 if 조건으로 건너뛴다. job이
  # 조건부로 skip되면 GitHub이 required check를 "성공"으로 취급하므로
  # 머지를 막지 않는다(docs/스킬 파일만 바뀐 PR을 위한 처리).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'client/**'
              - 'server/**'

  client:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # Playwright E2E(이슈 #48)는 Gemini만 StubAiChatService로 갈아끼우고
      # 나머지(서버/Postgres/위시리스트 CRUD)는 전부 진짜로 붙는다 — 그래서
      # server job과 똑같은 postgres/redis 서비스 컨테이너가 필요하고, 서버를
      # e2e 프로필로 백그라운드 기동한 뒤 준비될 때까지 기다린다.
      - name: Start server (e2e profile)
        working-directory: server
        env:
          SPRING_PROFILES_ACTIVE: e2e
          KAKAO_API_KEY: ${{ secrets.KAKAO_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew bootRun --no-daemon &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/wishlist > /dev/null; then
              echo "server is up"
              exit 0
            fi
            sleep 2
          done
          echo "server did not become ready in time" >&2
          exit 1
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_KAKAO_MAP_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_MAP_KEY }}
        run: pnpm run test:e2e

  server:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # postgres 서비스 컨테이너는 더 이상 없다 — @SpringBootTest 통합 테스트가
    # Testcontainers로 매번 자기 컨테이너를 직접 띄우기 때문(이슈 #49). ubuntu-latest
    # 러너는 이미 Docker 데몬이 떠있어서(services: 컨테이너도 그걸로 도는 것) 별도
    # 설정 없이 Testcontainers가 그대로 동작한다. redis는 아직 정적 접속 정보
    # (application-test.properties)를 쓰는 경로가 남아있을 수 있어 그대로 둔다.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon
